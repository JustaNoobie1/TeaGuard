[project]
name = "teaguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JustaNoobie1", email = "your-thimanthasasindu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "keras>=3.15.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
teaguard = "teaguard:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
